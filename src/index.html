<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>JcueScore</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="JcueScore - Plataforma de gestión y competencia para billares" />
    <link rel="icon" type="image/png" href="favicon.png?v=2" />
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1976d2">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>

    <!-- Service Worker personalizado para manejar clicks en notificaciones push nativas -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw-push-handler.js', { scope: '/' })
          .then(reg => console.log('[SW Push Handler] Registrado correctamente', reg.scope))
          .catch(err => console.warn('[SW Push Handler] Error al registrar:', err));
      }
    </script>
  </body>
</html>
