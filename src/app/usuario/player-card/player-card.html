<div class="player-card-container">
  <div class="profile-header">
    <div class="player-image-wrapper">
      @if (avatarUrl) {
        <img [src]="avatarUrl" alt="Player" class="player-img" />
      } @else {
        <div class="default-avatar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
            <circle cx="12" cy="7" r="4" />
          </svg>
        </div>
      }
    </div>
    
    <div class="player-info">
      <h3 class="player-name">{{ player.name }} {{ player.lastName }}</h3>
      <span class="club-name">{{ player.clubName || 'JcueScore Club' }}</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-item coins" style="grid-column: 1 / -1;">
      <span class="stat-label">Tu Saldo Disponible</span>
      <span class="stat-value" style="color: #fbbf24; font-size: 1.6rem; text-shadow: 0 0 10px rgba(251,191,36,0.3);">
        🪙 {{ player.jcueCoins }} JcueCoins
      </span>
    </div>
  </div>
</div>
