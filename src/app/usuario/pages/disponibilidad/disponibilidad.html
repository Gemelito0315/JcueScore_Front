<div class="page-header">
  <div>
    <h2>Disponibilidad</h2>
    <p>Estado en tiempo real de mesas y recursos</p>
  </div>
  <div class="live-badge">
    <span class="live-dot"></span> En vivo
  </div>
</div>

<div class="legend">
  <span class="leg libre">● Libre</span>
  <span class="leg ocupada">● Ocupada</span>
  <span class="leg mant">● Mantenimiento</span>
</div>

<div class="filters">
  <button [class.active]="filtro() === 'todos'" (click)="filtro.set('todos')">Todos</button>
  <button [class.active]="filtro() === 'billar'" (click)="filtro.set('billar')">🎱 Billar</button>
  <button [class.active]="filtro() === 'tejo'" (click)="filtro.set('tejo')">🎯 Tejo</button>
  <button [class.active]="filtro() === 'bolirama'" (click)="filtro.set('bolirama')">🎳 Bolirama</button>
</div>

<div class="recursos-grid">
  @for (r of filtrados; track r.id) {
    <div class="recurso-card" [class]="getEstadoClass(r.estado)">
      <div class="recurso-top">
        <span class="recurso-icon">{{ getIcon(r.tipo) }}</span>
        <span class="estado-badge" [class]="getEstadoClass(r.estado)">{{ r.estado }}</span>
      </div>
      <h4>{{ r.nombre }}</h4>
      <p class="tipo">{{ r.tipo }}</p>
      <p class="precio">${{ r.precio | number }}/hora</p>
      @if (r.estado === 'libre') {
        <button class="btn-reservar">Reservar</button>
      }
    </div>
  }
</div>
