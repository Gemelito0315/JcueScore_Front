<div class="layout" [class.collapsed]="!sidebarOpen()">
  <div class="accent-glow"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">🎱</div>
      <span class="brand-name">JcueScore</span>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>

    <nav class="sidebar-nav">

      @for (item of navItems; track item.label) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" [innerHTML]="item.svgPath"></svg>
          <span>{{ item.label }}</span>
        </a>
      }

    </nav>

    <div class="sidebar-footer">
      <div class="admin-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        <span>Admin</span>
      </div>
      <div class="user-info">
        <div class="user-avatar">{{ currentUser()?.name?.charAt(0) }}</div>
        <div class="user-meta">
          <span class="user-name">{{ currentUser()?.name }}</span>
          <span class="user-role">Administrador</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span>Cerrar sesión</span>
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="page-title">{{ pageTitle() }}</h1>
        <p class="page-subtitle">{{ pageSubtitle() }}</p>
      </div>
      <div class="topbar-right">
        <div class="widget-clock">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="clock-icon">
            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
          </svg>
          <span class="clock-time">{{ currentTime() }}</span>
        </div>
        <div class="admin-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
          Administrador
        </div>
      </div>
    </header>

    <router-outlet />
  </main>
</div>
