<div class="login-container">

  @if (isLoading()) {
    <div class="loading-overlay">
      <div class="loader-wrapper">
        <div class="orbit-ring">
          <div class="orbit-ball"></div>
        </div>
        <div class="orbit-ring ring2">
          <div class="orbit-ball ball2"></div>
        </div>
        <div class="orbit-ring ring3">
          <div class="orbit-ball ball3"></div>
        </div>
        <div class="loader-icon">🎱</div>
      </div>
      <p class="loading-text">Ingresando...</p>
    </div>
  }

  <div class="login-card" [class.card-blurred]="isLoading()">
    <div class="brand">
      <h1 class="brand-title">JcueScore</h1>
      <p class="brand-subtitle">Sports Management Platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="admin@billar.com"
          class="input-field"
          [disabled]="isLoading()"
          autocomplete="off"
        />
      </div>

      <div class="field-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            class="input-field"
            [disabled]="isLoading()"
            autocomplete="new-password"
          />
          <button type="button" class="toggle-pass" (click)="hidePassword = !hidePassword">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
      </div>

      @if (errorMsg) {
        <div class="error-banner">
          <span class="error-icon">⚠️</span>
          <span>{{ errorMsg }}</span>
        </div>
      }

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          <span class="btn-spinner"></span>
          Ingresando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/auth/sign-in">Regístrate</a>
    </p>
  </div>
</div>
