<div class="login-container">
  <div class="login-card">
    <div class="brand">
      <h1 class="brand-title">JcueScore</h1>
      <p class="brand-subtitle">Sports Management Platform</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label>Email</label>
        <input
          type="email"
          formControlName="email"
          placeholder="admin@billar.com"
          class="input-field"
        />
      </div>

      <div class="field-group">
        <label>Contraseña</label>
        <div class="password-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            class="input-field"
          />
          <button type="button" class="toggle-pass" (click)="hidePassword = !hidePassword">
            {{ hidePassword ? '👁️' : '🙈' }}
          </button>
        </div>
      </div>

      @if (errorMsg) {
        <p class="error-msg">{{ errorMsg }}</p>
      }

      <button type="submit" class="btn-primary">
        Ingresar
      </button>
    </form>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/auth/sign-in">Regístrate</a>
    </p>
  </div>
</div>
